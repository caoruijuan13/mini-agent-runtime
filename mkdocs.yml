site_name: mini-agent-runtime 技术文档
site_description: 由学习者主导的 Python Agent Runtime 学习项目
docs_dir: docs
site_dir: site
strict: true

theme:
  name: mkdocs
  locale: zh_CN
  color_mode: auto
  user_color_mode_toggle: true
  highlightjs: true

nav:
  - 从这里开始: index.md
  - 第一阶段: learning.md
  - 候选路线: roadmap.md
  - 参考:
      - 运行时原理: agent-loop.md
      - 验证: quality.md
      - 当前边界: limitations.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
