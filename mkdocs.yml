site_name: mini-agent-runtime 技术文档
site_description: Rust 模型网关与 Python Agent 的架构、接口、测试和性能基线
docs_dir: docs
site_dir: site
strict: true

theme:
  name: mkdocs
  locale: zh_CN
  color_mode: auto
  user_color_mode_toggle: true
  highlightjs: true

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 架构设计: architecture.md
  - 核心流程:
      - Agent 循环: agent-loop.md
      - 工具系统: tools.md
      - 模型与流式传输: llm-streaming.md
  - 服务接口: server-api.md
  - 配置说明: configuration.md
  - 工程质量:
      - QA 与测试: quality.md
      - 性能基线: performance.md
  - 学习与优化路线图: roadmap.md
  - 开发与扩展: development.md
  - 已知边界: limitations.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
